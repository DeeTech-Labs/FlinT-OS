name: Feature request
description: Propose a new capability or improvement for FlinT OS
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the idea. For open-ended brainstorming prefer
        [Discussions](https://github.com/DeeTech-Labs/FlinT-OS/discussions).
        For a new watch face, use the **Face proposal** template instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What is hard or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should FlinT OS do? Keep scope concrete when possible.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - UI / shell
        - Faces / Face SDK
        - Settings
        - Networking
        - Time / clock
        - i18n
        - Board / hardware
        - Build / tooling
        - Docs
        - Other
      default: 9
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Extra context
