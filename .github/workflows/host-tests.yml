name: Platform and S3
on:
    pull_request:
    push:
        branches: [main]
permissions:
    contents: read
jobs:
    platform:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive
            - run: python3 -m pip install Pillow
            - run: cmake -S platform -B /tmp/flint-platform -DCMAKE_BUILD_TYPE=Debug
            - run: cmake --build /tmp/flint-platform --parallel 2
            - run: ctest --test-dir /tmp/flint-platform --output-on-failure
            - run: python3 -m unittest discover -s tools/tests -v
            - run: |
                    python3 platform/tools/generate_registry.py
                    python3 platform/tools/build_system.py
                    git -C platform diff --exit-code -- include/flint/registry.h include/flint/services.h factory examples
    firmware:
        runs-on: ubuntu-latest
        container: espressif/idf:v6.0.2
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive
            - name: Compile S3 firmware locally
              shell: bash
              run: |
                    . /opt/esp/idf/export.sh
                    idf.py -DIDF_TARGET=esp32s3 build
