name: Host tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host + tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Host C++ regression tests
        env:
          CXX: g++
        run: make -C tests/host run

      - name: Tools gen_* smoke
        run: |
          python3 -m pip install pyserial==3.5
          python3 -m unittest discover -s tools/tests -v

      - name: Codegen artifacts in sync
        run: |
          set -euo pipefail
          python3 tools/gen_i18n_catalog.py
          git diff --exit-code -- components/flint/i18n/i18n_catalog.inc
          python3 tools/gen_asset_pack.py
          git diff --exit-code -- assets/fs_root/core.flintpack
          # Board outputs are gitignored; regen must succeed for the default board.
          python3 tools/gen_board_catalog.py --quiet

  firmware:
    name: ESP32-C3 firmware (ESP-IDF 6.0.2)
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    env:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v5
      - name: Cache firmware dependencies
        uses: actions/cache@v4
        with:
          path: |
            third_party/LovyanGFX
            managed_components
            /root/.cache/Espressif
          key: firmware-deps-idf6.0.2-c3-${{ hashFiles('**/idf_component.yml', 'components/LovyanGFX/CMakeLists.txt') }}
      - name: Cache firmware compilation
        uses: actions/cache@v4
        with:
          path: .ccache
          key: firmware-ccache-idf6.0.2-c3-${{ hashFiles('config/sdkconfig.defaults', '**/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            firmware-ccache-idf6.0.2-c3-${{ hashFiles('config/sdkconfig.defaults', '**/CMakeLists.txt') }}-
            firmware-ccache-idf6.0.2-c3-
      - name: Build offline firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -DIDF_TARGET=esp32c3 build
      - name: Compiler cache statistics
        if: always()
        shell: bash
        run: ccache --show-stats
